<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធគ្រប់គ្រងការលក់ - Ravy Store POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { font-family: 'Kantumruy Pro', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Navigation Bar -->
    <header class="bg-emerald-600 text-white shadow-md flex-none z-10 px-4 py-3 flex justify-between items-center sticky top-0">
        <div class="flex items-center gap-3">
            <div class="bg-white text-emerald-600 p-2 rounded-lg font-bold text-xl shadow">
                <i class="fa-solid fa-store"></i>
            </div>
            <div>
                <h1 class="font-bold text-base sm:text-lg leading-tight">ប្រព័ន្ធគ្រប់គ្រងការលក់ (POS)</h1>
                <p class="text-xs text-emerald-100">ហាងទំនិញ - Ravy Store | 096 255 7766 / 088 413 2413</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button onclick="toggleProductModal()" class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs sm:text-sm px-3 py-2 rounded-lg transition flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-plus-circle"></i>
                <span class="font-semibold">បន្ថែមទំនិញ</span>
            </button>
            <button onclick="toggleKhqrModal()" class="bg-emerald-700 hover:bg-emerald-800 text-white text-xs sm:text-sm px-3 py-2 rounded-lg transition flex items-center gap-1.5">
                <i class="fa-solid fa-qrcode"></i>
                <span class="hidden sm:inline font-semibold">KHQR</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col md:flex-row overflow-hidden">
        <!-- Left Product Grid -->
        <div class="flex-1 flex flex-col p-3 sm:p-4 gap-4 overflow-y-auto">
            <div class="bg-white p-3 rounded-xl shadow-sm flex flex-col sm:flex-row gap-3 items-center justify-between">
                <div class="relative w-full sm:w-72">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-input" oninput="filterProducts()" placeholder="ស្វែងរកឈ្មោះទំនិញ..." 
                           class="w-full pl-9 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div class="flex gap-2 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0" id="category-filters"></div>
            </div>
            <div id="products-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4"></div>
        </div>

        <!-- Right Order Summary -->
        <div class="w-full md:w-96 bg-white border-t md:border-t-0 md:border-l border-slate-200 flex flex-col shadow-lg">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-emerald-600 text-lg"></i>
                    <h2 class="font-bold text-slate-700">កន្ត្រកទំនិញ</h2>
                    <span id="cart-count-badge" class="bg-emerald-100 text-emerald-700 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </div>
                <button onclick="clearCart()" class="text-xs text-rose-500 hover:text-rose-700 font-medium hover:underline flex items-center gap-1">
                    <i class="fa-solid fa-trash-can"></i> សម្អាត
                </button>
            </div>

            <div id="cart-items-list" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3 min-h-[200px]"></div>

            <div class="p-4 border-t border-slate-100 bg-slate-50 flex flex-col gap-2 text-sm">
                <div class="flex justify-between text-slate-500">
                    <span>សរុបរង:</span>
                    <span id="cart-subtotal" class="font-semibold text-slate-700">0 ៛</span>
                </div>
                <div class="flex justify-between items-center text-lg font-bold text-slate-800">
                    <span>សរុបរួម:</span>
                    <div id="cart-total-khr" class="text-xl font-bold text-emerald-600">0 ៛</div>
                </div>

                <button onclick="alert('ទូទាត់ប្រាក់បានជោគជ័យ!'); clearCart();" id="checkout-btn" disabled class="w-full mt-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-md disabled:bg-slate-300 disabled:cursor-not-allowed transition flex justify-center items-center gap-2">
                    <i class="fa-solid fa-credit-card"></i> គិតប្រាក់ (Checkout)
                </button>
            </div>
        </div>
    </div>

    <!-- Product Modal -->
    <div id="product-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="bg-emerald-600 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-boxes-stacked mr-2"></i>បន្ថែមទំនិញថ្មី</h3>
                <button onclick="toggleProductModal()" class="text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-4 overflow-y-auto flex flex-col gap-6">
                <form id="add-product-form" onsubmit="handleAddNewProduct(event)" class="bg-slate-50 p-4 rounded-xl border flex flex-col gap-3">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold mb-1">ឈ្មោះទំនិញ *</label>
                            <input type="text" id="new-prod-name" required class="w-full p-2 border rounded-lg text-xs">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1">តម្លៃ (លុយរៀល ៛) *</label>
                            <input type="number" id="new-prod-price" min="0" step="100" required class="w-full p-2 border rounded-lg text-xs font-bold">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1">ប្រភេទទំនិញ</label>
                            <select id="new-prod-cat" class="w-full p-2 border rounded-lg text-xs bg-white">
                                <option value="drink">ភេសជ្ជៈ</option>
                                <option value="food">អាហារ</option>
                                <option value="bakery">នំ</option>
                                <option value="snack">សម្រន់</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1">រូបភាព (ជ្រើសរើសពីទូរស័ព្ទ)</label>
                            <input type="file" id="new-prod-file" accept="image/*" class="w-full p-1 text-[11px] border rounded-lg bg-white mb-1">
                            <input type="url" id="new-prod-img" placeholder="ឬបិទ Link https://..." class="w-full p-2 border rounded-lg text-xs">
                        </div>
                    </div>
                    <button type="submit" id="btn-submit-prod" class="py-2.5 px-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-xs shadow flex justify-center items-center gap-2">
                        <span>រក្សាទុកទំនិញថ្មី</span>
                    </button>
                </form>
                <div id="mgmt-prod-list" class="border rounded-xl divide-y max-h-60 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'ravy_pos_products_v3';
        
        const defaultProducts = [
            { id: 1, name: "កាហ្វេទឹកដោះគោ (Iced Latte)", category: "drink", price: 9000, image: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=300" },
            { id: 2, name: "កាហ្វេខ្មៅ (Americano)", category: "drink", price: 7000, image: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=300" },
            { id: 3, name: "តែបៃតងទឹកដោះគោ (Matcha)", category: "drink", price: 10000, image: "https://images.unsplash.com/photo-1536256263959-770b48d82b0a?w=300" },
            { id: 4, name: "នំប៉័ងប័រសូកូឡា (Croissant)", category: "bakery", price: 7500, image: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=300" }
        ];

        function loadProducts() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : defaultProducts;
            } catch(e) {
                return defaultProducts;
            }
        }

        function saveProducts(data) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            } catch(e) {
                alert("មិនអាចរក្សាទុកបាន! សូមជ្រើសរើសរូបភាពទំហំតូចជាងនេះ។");
            }
        }

        let products = loadProducts();
        let cart = [];
        let currentCategory = "all";

        const categories = [
            { id: "all", name: "ទាំងអស់" },
            { id: "drink", name: "ភេសជ្ជៈ" },
            { id: "food", name: "អាហារ" },
            { id: "bakery", name: "នំ" },
            { id: "snack", name: "សម្រន់" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderCategoryFilters();
            filterProducts();
            renderMgmtProductList();
        });

        function renderCategoryFilters() {
            const container = document.getElementById('category-filters');
            if (!container) return;
            container.innerHTML = categories.map(cat => `
                <button onclick="setCategoryFilter('${cat.id}')" class="px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap ${currentCategory === cat.id ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'}">
                    ${cat.name}
                </button>
            `).join('');
        }

        function setCategoryFilter(id) {
            currentCategory = id;
            renderCategoryFilters();
            filterProducts();
        }

        function filterProducts() {
            const search = document.getElementById('search-input')?.value.toLowerCase().trim() || '';
            const filtered = products.filter(p => {
                const matchCat = currentCategory === 'all' || p.category === currentCategory;
                const matchSearch = p.name.toLowerCase().includes(search);
                return matchCat && matchSearch;
            });
            renderProducts(filtered);
        }

        function renderProducts(list) {
            const grid = document.getElementById('products-grid');
            if (!grid) return;
            grid.innerHTML = list.map(p => `
                <div onclick="addToCart(${p.id})" class="bg-white rounded-xl shadow-sm border overflow-hidden hover:shadow-md cursor-pointer flex flex-col">
                    <div class="h-28 bg-slate-100 relative">
                        <img src="${p.image}" alt="${p.name}" onerror="this.src='https://placehold.co/300x200/e2e8f0/64748b?text=Product'" class="w-full h-full object-cover">
                        <span class="absolute top-2 right-2 bg-emerald-600 text-white text-xs font-bold px-2 py-1 rounded-full">${p.price.toLocaleString('km-KH')} ៛</span>
                    </div>
                    <div class="p-2.5 flex-1 flex flex-col justify-between">
                        <h3 class="font-semibold text-slate-800 text-xs">${p.name}</h3>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const p = products.find(prod => prod.id === id);
            if (!p) return;
            const exist = cart.find(c => c.id === id);
            if (exist) exist.qty += 1;
            else cart.push({ ...p, qty: 1 });
            renderCart();
        }

        function renderCart() {
            const list = document.getElementById('cart-items-list');
            document.getElementById('cart-count-badge').textContent = cart.reduce((s, i) => s + i.qty, 0);

            if (cart.length === 0) {
                list.innerHTML = `<div class="text-center text-slate-400 py-8 text-xs">មិនទាន់មានទំនិញក្នុងកន្ត្រក</div>`;
            } else {
                list.innerHTML = cart.map(item => `
                    <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-lg border text-xs">
                        <div class="flex-1">
                            <h4 class="font-semibold text-slate-800">${item.name}</h4>
                            <div class="text-slate-500">${item.price.toLocaleString('km-KH')} ៛ × ${item.qty}</div>
                        </div>
                    </div>
                `).join('');
            }
            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cart-subtotal').textContent = `${subtotal.toLocaleString('km-KH')} ៛`;
            document.getElementById('cart-total-khr').textContent = `${subtotal.toLocaleString('km-KH')} ៛`;
            document.getElementById('checkout-btn').disabled = cart.length === 0;
        }

        function clearCart() { cart = []; renderCart(); }
        function toggleProductModal() { document.getElementById('product-modal').classList.toggle('hidden'); }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const maxWidth = 200;
                    const scale = maxWidth / img.width;
                    canvas.width = maxWidth;
                    canvas.height = img.height * scale;
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    callback(canvas.toDataURL('image/jpeg', 0.5));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function handleAddNewProduct(e) {
            if (e) e.preventDefault();
            const name = document.getElementById('new-prod-name').value.trim();
            const price = parseFloat(document.getElementById('new-prod-price').value);
            const category = document.getElementById('new-prod-cat').value || 'drink';
            const imgInput = document.getElementById('new-prod-img');
            const fileInput = document.getElementById('new-prod-file');

            if (!name || isNaN(price) || price <= 0) return;

            const saveProd = (imgSrc) => {
                const newProd = { id: Date.now(), name, price, category, image: imgSrc };
                products.unshift(newProd);
                saveProducts(products);

                document.getElementById('new-prod-name').value = '';
                document.getElementById('new-prod-price').value = '';
                imgInput.value = '';
                fileInput.value = '';

                currentCategory = "all";
                renderCategoryFilters();
                filterProducts();
                renderMgmtProductList();
                toggleProductModal();
                alert(`បានបន្ថែម "${name}" រួចរាល់!`);
            };

            if (fileInput.files && fileInput.files[0]) {
                compressImage(fileInput.files[0], saveProd);
            } else {
                const url = imgInput.value.trim() || 'https://placehold.co/300x200/e2e8f0/64748b?text=' + encodeURIComponent(name);
                saveProd(url);
            }
        }

        function deleteProduct(id) {
            products = products.filter(p => p.id !== id);
            cart = cart.filter(c => c.id !== id);
            saveProducts(products);
            filterProducts();
            renderCart();
            renderMgmtProductList();
        }

        function renderMgmtProductList() {
            const container = document.getElementById('mgmt-prod-list');
            if (!container) return;
            if (products.length === 0) {
                container.innerHTML = `<div class="p-4 text-center text-xs text-slate-400">មិនទាន់មានទំនិញ</div>`;
                return;
            }
            container.innerHTML = products.map(p => `
                <div class="p-2.5 flex items-center justify-between hover:bg-slate-50">
                    <div class="flex items-center gap-3">
                        <img src="${p.image}" class="w-10 h-10 object-cover rounded border">
                        <div>
                            <div class="font-bold text-xs text-slate-800">${p.name}</div>
                            <div class="text-[10px] text-emerald-600 font-bold">${p.price.toLocaleString('km-KH')} ៛</div>
                        </div>
                    </div>
                    <button onclick="deleteProduct(${p.id})" class="text-rose-500 hover:text-rose-700 text-xs px-2 py-1 rounded bg-rose-50 font-semibold">
                        <i class="fa-solid fa-trash"></i> លុប
                    </button>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
